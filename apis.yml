aid: hopper
name: Hopper
description: >-
  Hopper Inc. is a Montreal-based online travel agency and B2B travel fintech
  company, founded in 2007 by Frederic Lalonde, Joost Ouwerkerk, and Dakota
  Smith. Its consumer mobile app pairs flight, hotel, car, and homes booking
  with proprietary price prediction, and monetizes a family of "for any reason"
  fintech ancillaries — Price Freeze, Cancel For Any Reason (CFAR), Change For
  Any Reason, and Disruption Guarantee. Through Hopper Technology Solutions
  (HTS), the company licenses those same ancillaries, agentic AI customer
  servicing (HTS Assist), white-label travel commerce (HTS Stays, HTS Cars, HTS
  Packages), and loyalty portals to airlines, banks, and travel providers
  including Capital One, Air Canada, Wizz Air, Porter, Avelo, and RBC. Hopper
  has raised more than $740 million from investors including Goldman Sachs,
  Brookfield, Citigroup, and Caisse de Depot et Placement du Quebec, and its
  shares trade on secondary marketplaces such as Forge Global and EquityZen
  ahead of a possible public listing.
